name: Auto_Dummy_Activity

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action_note:
        description: 'Optional note for the run'
        required: false
        default: 'Manual trigger'

jobs:
  dummy-activity:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process and Manage Temp Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Create temp directory if it does not exist
          mkdir -p temp
          
          # 2. Check current number of files in the temp directory
          existing_files=$(find temp -maxdepth 1 -type f -name "*.txt" | wc -l)
          echo "[INFO] Current number of files in temp: $existing_files"
          
          if [ "$existing_files" -ge 100 ]; then
              echo "[INFO] Temp directory has reached 100 files. Cleaning up to prevent repo bloat..."
              rm -rf temp/*
              next_number=1
          else
              # Find the next sequence number based on the largest existing filename
              last_file=$(find temp -maxdepth 1 -type f -name "*.txt" | sed 's|temp/||;s|\.txt||' | sort -n | tail -n 1)
              if [ -z "$last_file" ]; then
                  next_number=1
              else
                  next_number=$((last_file + 1))
              fi
          fi
          
          # 3. Create log content and save it to the temp directory
          file_name="temp/$next_number.txt"
          current_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          random_payload=$(date +%s%N | md5sum | head -c 10)
          
          echo "==========================================" > "$file_name"
          echo "Status: SUCCESS" >> "$file_name"
          echo "File Index: $next_number" >> "$file_name"
          echo "Payload Check: $random_payload" >> "$file_name"
          echo "Timestamp: $current_time" >> "$file_name"
          echo "==========================================" >> "$file_name"
          
          echo "[SUCCESS] Created new file: $file_name"

      - name: Commit and Push Changes
        run: |
          git add temp/
          
          # Check if there are actual changes to commit
          if git diff --staged --quiet; then
              echo "[INFO] No new changes to commit."
          else
              current_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
              git commit -m "chore(temp): update automated log results [$current_time]"
              git push
              echo "[SUCCESS] Successfully pushed changes to the temp directory on the repository!"
          fi

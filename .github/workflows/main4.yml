name: Auto_Dummy_Activity

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dummy-activity:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Random Activity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tạo thư mục dummy nếu chưa có
          mkdir -p .github/dummy
          
          # Tạo một chuỗi ngẫu nhiên hoặc thời gian hiện tại để file luôn thay đổi nội dung
          RANDOM_STRING=$(date +%s%N | md5sum | head -c 10)
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S")
          
          echo "Dummy activity payload: $RANDOM_STRING at $CURRENT_TIME" > .github/dummy/activity.log
          
          # Kiểm tra thay đổi và push
          git add .github/dummy/activity.log
          
          # Chỉ commit nếu thực sự có thay đổi
          git diff --staged --quiet || (git commit -m "chore(dummy): automated activity trigger [$CURRENT_TIME]" && git push)

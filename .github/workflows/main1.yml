name: create_account

on:
  workflow_dispatch:

jobs:
  run-crd:
    runs-on: windows-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: powershell
        run: |
          pip install playwright
          playwright install chromium

      - name: Prepare Extension
        shell: powershell
        run: |
          $extDir = "C:\extensions"
          if (Test-Path $extDir) { Remove-Item -Recurse -Force $extDir }
          New-Item -ItemType Directory -Force -Path $extDir | Out-Null

          $extensionUrl = "https://github.com/lamnguyenkhang78/minecraft_server/releases/download/mywork/iomcoelgdkghlligeempdbfcaobodacg.zip"
          
          Write-Host "[LOG] Downloading extension package from direct link..."
          $zipPath = "$extDir\extension.zip"
          try {
              Invoke-WebRequest -Uri $extensionUrl -OutFile $zipPath
              Write-Host "[LOG] Extracting extension archive..."
              Expand-Archive -Path $zipPath -DestinationPath $extDir -Force
              Remove-Item $zipPath -Force
              Write-Host "[SUCCESS] Extension downloaded and extracted!"
          } catch {
              Write-Host "[ERROR] Failed to download extension: $_"
          }

      - name: create file
        shell: powershell
        run: |
          $code = @'
          import time
          import random
          import os
          import shutil
          import sys
          import subprocess

          sys.stdout.reconfigure(encoding='utf-8')
          from playwright.sync_api import sync_playwright

          def generate_user_info():
              # Mixed Vietnamese and English names for maximum diversity
              first_names_pool = [
                  "Nguyen", "Tran", "Le", "Pham", "Hoang", "Huynh", "Phan", "Vu", "Vo", "Dang",
                  "Bui", "Do", "Ho", "Ngo", "Duong", "Ly", "Truong", "Dao", "Dinh", "Mai",
                  "James", "Michael", "Robert", "David", "William", "Richard", "Joseph", "Thomas", "Charles", "Daniel"
              ]
              middle_names_pool = [
                  "Van", "Thi", "Huu", "Gia", "Minh", "Dinh", "Quang", "Ngoc", "Thanh", "Xuan",
                  "Duc", "Hoang", "Tuan", "Phuong", "Hong", "Kim", "Anh", "The", "Huy", "Alexander",
                  "Lee", "Ray", "Alan", "Paul", "Scott", "J", "W", "A"
              ]
              last_names_pool = [
                  "Khang", "An", "Binh", "Cuong", "Dung", "Dat", "Giang", "Hai", "Hieu", "Huy",
                  "Khoa", "Linh", "Long", "Minh", "Nam", "Nghia", "Phong", "Phuc", "Quan", "Son",
                  "Thang", "Thanh", "Thien", "Tien", "Toan", "Trung", "Tuan", "Viet",
                  "Smith", "Johnson", "Williams", "Brown", "Jones", "Miller", "Davis", "Wilson", "Taylor", "Anderson"
              ]
              
              f_name = random.choice(first_names_pool)
              m_name = random.choice(middle_names_pool)
              l_name = random.choice(last_names_pool)
              
              first_name_val = f"{f_name} {m_name}"
              last_name_val = l_name
              
              # Generate unique email using combination and random suffix numbers
              random_suffix = random.randint(10000, 999999)
              email_val = f"{f_name.lower()}{m_name.lower()}{l_name.lower()}{random_suffix}@gmail.com"
              
              return first_name_val, last_name_val, email_val

          def clear_old_profile(profile_dir):
              if os.path.exists(profile_dir):
                  try: shutil.rmtree(profile_dir)
                  except: pass

          def find_extension_root(base_dir):
              if not os.path.exists(base_dir):
                  return None
              if os.path.exists(os.path.join(base_dir, "manifest.json")):
                  return base_dir
              for root, dirs, files in os.walk(base_dir):
                  if "manifest.json" in files:
                      return root
              return base_dir

          def reset_network_powershell():
              print("[LOG] Resetting network configuration via PowerShell...")
              try:
                  command = (
                      "ipconfig /flushdns && "
                      "netsh int ip reset && "
                      "netsh winsock reset"
                  )
                  subprocess.run(["powershell", "-Command", command], capture_output=True, text=True, shell=True)
                  print("[SUCCESS] Network reset completed successfully!")
                  time.sleep(3)
              except Exception as e:
                  print(f"[WARNING] Could not reset network automatically: {e}")

          def run_auto_registration():
              work_link = os.environ.get("MY_WORK_LINK", "https://cloud-miner.cloud/?i=78272&lang=EN")
              raw_ext_path = r"C:\extensions"
              extension_path = find_extension_root(raw_ext_path)
              profile_dir = r"C:\temp\playwright_profile_raptor"
              
              print(f"==============================================")
              print(f"--- Automated Account Registration Script ---")
              print(f"==============================================")
              print(f"[CONFIG] Target Link: {work_link}")
              print(f"[CONFIG] Extension Path: {extension_path}")
              
              # 1. Reset network
              reset_network_powershell()
              
              # 2. Clear previous profile
              clear_old_profile(profile_dir)

              with sync_playwright() as p:
                  launch_args = ["--no-sandbox"]
                  if extension_path and os.path.exists(os.path.join(extension_path, "manifest.json")):
                      launch_args.append(f"--load-extension={extension_path}")
                      launch_args.append(f"--disable-extensions-except={extension_path}")
                      print(f"[LOG] Extension loaded successfully from: {extension_path}")
                  else:
                      print("[WARNING] manifest.json not found, running without extension.")

                  context = p.chromium.launch_persistent_context(
                      user_data_dir=profile_dir,
                      headless=False,
                      args=launch_args,
                      viewport={"width": 1366, "height": 768}
                  )
                  page = context.new_page()
                  
                  try:
                      print(f"[LOG] Navigating to URL: {work_link}")
                      page.goto(work_link, wait_until="domcontentloaded")
                      time.sleep(2)
                      
                      print("[LOG] Clicking 'Sign up' link...")
                      page.get_by_role("link", name="Sign up").click()
                      
                      first_name, last_name, email_val = generate_user_info()
                      password_val = "MatKhau123@"
                      
                      print(f"[LOG] Generated Profile -> First Name: {first_name} | Last Name: {last_name} | Email: {email_val}")
                      
                      page.fill("input[placeholder='First name']", first_name)
                      page.fill("input[placeholder='Last name']", last_name)
                      page.fill("input[placeholder='Email']", email_val)
                      page.fill("input[placeholder='Password']", password_val)
                      page.fill("input[placeholder='Re-password']", password_val)
                      
                      # Trigger captcha to let extension solve it
                      print("[LOG] Waiting for extension to solve reCAPTCHA...")
                      try: 
                          page.frame_locator("iframe[title*='reCAPTCHA']").locator("#recaptcha-anchor").click(force=True)
                      except: 
                          try:
                              page.locator("iframe[title*='reCAPTCHA']").first.click(force=True)
                          except Exception as ex:
                              print(f"[WARNING] Could not click captcha frame: {ex}")
                              
                      # Wait for green checkmark up to 3 minutes (225 attempts x 0.8s)
                      is_solved = False
                      for _ in range(225):
                          try:
                              if page.frame_locator("iframe[title*='reCAPTCHA']").locator("#recaptcha-anchor").get_attribute("aria-checked") == "true":
                                  is_solved = True
                                  break
                          except: 
                              pass
                          time.sleep(0.8)
                          
                      if is_solved:
                          print("[SUCCESS] reCAPTCHA solved (green checkmark detected)!")
                          page.get_by_role("button", name="Register").click(force=True)
                          print("[SUCCESS] Clicked Register button successfully!")
                          time.sleep(4) # Wait for redirect to dashboard
                          
                          # Click START button (Miner)
                          print("[LOG] Clicking START button (Miner)...")
                          try:
                              page.get_by_text("START").click(force=True)
                          except:
                              try:
                                  page.locator("text=START").first.click(force=True)
                              except Exception as ex:
                                  print(f"[WARNING] Could not find START button to click: {ex}")
                          
                          print("[LOG] START clicked, waiting 10 seconds before finishing...")
                          time.sleep(10)
                      else:
                          print("[WARNING] reCAPTCHA timeout exceeded.")
                          
                  except Exception as e: 
                      print(f"[ERROR]: {e}")
                      
                  context.close()

          if __name__ == "__main__":
              run_auto_registration()
          '@
          Set-Content -Path "auto.py" -Value $code -Encoding UTF8

      - name: Run auto.py
        shell: powershell
        env:
          MY_WORK_LINK: ${{ secrets.MY_WORK_LINK }}
        run: python auto.py

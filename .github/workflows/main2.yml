name: my_work

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 5,11,17 * * *'
    - cron: '23 23 * * *'

jobs:
  run-crd:
    runs-on: windows-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: powershell
        run: |
          pip install playwright
          playwright install chromium

      - name: Prepare Extension & Script
        shell: powershell
        run: |
          $extDir = "C:\extensions"
          if (Test-Path $extDir) { Remove-Item -Recurse -Force $extDir }
          New-Item -ItemType Directory -Force -Path $extDir | Out-Null

          # Link trực tiếp nhúng thẳng vào code theo yêu cầu của bạn
          $extensionUrl = "https://github.com/lamnguyenkhang78/minecraft_server/releases/download/mywork/iomcoelgdkghlligeempdbfcaobodacg.zip"
          
          Write-Host "[LOG] Downloading extension package from direct link..."
          $zipPath = "$extDir\extension.zip"
          try {
              Invoke-WebRequest -Uri $extensionUrl -OutFile $zipPath
              Write-Host "[LOG] Extracting extension archive..."
              Expand-Archive -Path $zipPath -DestinationPath $extDir -Force
              Remove-Item $zipPath -Force
              Write-Host "[SUCCESS] Extension downloaded and extracted!"
          } catch {
              Write-Host "[ERROR] Failed to download extension: $_"
          }

      - name: create file
        shell: powershell
        run: |
          $code = @'
          import time
          import os
          import shutil
          import sys
          import re

          sys.stdout.reconfigure(encoding='utf-8')
          from playwright.sync_api import sync_playwright

          def find_extension_root(base_dir):
              # Tự động quét tìm thư mục chứa file manifest.json bên trong (xử lý vụ thư mục con phiên bản)
              if not os.path.exists(base_dir):
                  return None
              if os.path.exists(os.path.join(base_dir, "manifest.json")):
                  return base_dir
              for root, dirs, files in os.walk(base_dir):
                  if "manifest.json" in files:
                      return root
              return base_dir

          def perform_login(page, work_mail, work_password):
              print("[LOGIN HELPER] Checking if login is required...")
              email_selector = "input[name='email'], input[placeholder='Email']"
              
              is_login_page = False
              try:
                  if page.locator(email_selector).is_visible(timeout=3000):
                      is_login_page = True
              except:
                  pass

              if is_login_page:
                  print("[LOGIN HELPER] Detected login page (session expired or redirected). Re-authenticating...")
                  try:
                      page.fill(email_selector, work_mail)
                      password_selector = "input[name='password'], input[placeholder='Password']"
                      page.fill(password_selector, work_password)
                      
                      print("[LOGIN HELPER] Triggering reCAPTCHA...")
                      try:
                          page.frame_locator("iframe[title*='reCAPTCHA']").locator("#recaptcha-anchor").click(force=True)
                      except:
                          try:
                              page.locator("iframe[title*='reCAPTCHA']").first.click(force=True)
                          except Exception as ex:
                              print(f"[WARNING] Could not click reCAPTCHA anchor: {ex}")

                      solved = False
                      for _ in range(150): # Chờ tối đa ~2 phút giải captcha
                          try:
                              if page.frame_locator("iframe[title*='reCAPTCHA']").locator("#recaptcha-anchor").get_attribute("aria-checked") == "true":
                                  solved = True
                                  break
                          except:
                              pass
                          time.sleep(0.8)

                      if solved:
                          print("[LOGIN HELPER] reCAPTCHA passed! Clicking Login button...")
                          try:
                              page.get_by_role("button", name=re.compile("Log in|Sign in|Login", re.IGNORECASE)).click(force=True)
                          except:
                              try:
                                  page.locator("text=Log in").first.click(force=True)
                              except:
                                  page.locator("button[type='submit']").click(force=True)
                          time.sleep(5)
                          print("[LOGIN HELPER] Re-login completed successfully!")
                          return True
                      else:
                          print("[LOGIN HELPER] reCAPTCHA solving timeout during re-login.")
                  except Exception as ex:
                      print(f"[ERROR] Exception during re-login process: {ex}")
              return False

          def check_and_process():
              print("==================================================")
              print("[INIT] Starting automated process...")
              print("==================================================")
              
              work_link = os.environ.get("MY_WORK_LINK", "")
              work_mail = os.environ.get("MY_WORK_MAIL", "")
              work_password = os.environ.get("MY_WORK_PASSWORD", "")
              
              raw_ext_path = r"C:\extensions"
              extension_path = find_extension_root(raw_ext_path)
              print(f"[CONFIG] Target Extension Path for Chrome: {extension_path}")
              print(f"[CONFIG] Work Link: {work_link}")
              print(f"[CONFIG] Mail Account: {work_mail}")

              with sync_playwright() as p:
                  profile_dir = r"C:\temp\playwright_profile_raptor"
                  if os.path.exists(profile_dir):
                      print("[LOG] Cleaning up old profile directory...")
                      try: shutil.rmtree(profile_dir)
                      except Exception as e: print(f"[WARNING] Could not delete old profile: {e}")

                  print("[LOG] Launching Chromium browser with extension loaded...")
                  launch_args = ["--no-sandbox"]
                  if extension_path and os.path.exists(os.path.join(extension_path, "manifest.json")):
                      launch_args.append(f"--load-extension={extension_path}")
                      launch_args.append(f"--disable-extensions-except={extension_path}")
                      print(f"[LOG] Successfully loaded extension from: {extension_path}")
                  else:
                      print("[WARNING] manifest.json not found in extension path, running without extension.")

                  context = p.chromium.launch_persistent_context(
                      user_data_dir=profile_dir,
                      headless=False,
                      args=launch_args,
                      viewport={"width": 1366, "height": 768}
                  )
                  
                  page = context.new_page()

                  try:
                      # STEP 2: Access Page
                      print("\n--------------------------------------------------")
                      print("[STEP 2] Navigating to target URL...")
                      print("--------------------------------------------------")
                      if work_link:
                          print(f"[STEP 2] Navigating to URL: {work_link}")
                          page.goto(work_link, wait_until="networkidle")
                          time.sleep(3)
                          print(f"[STEP 2] Actual URL after load: {page.url}")
                          print("[STEP 2 - SUCCESS] Successfully loaded page!")
                      else:
                          print("[STEP 2 - ERROR] Missing 'MY_WORK_LINK' variable!")

                      # STEP 3 & 4: Initial Login & reCAPTCHA
                      print("\n--------------------------------------------------")
                      print("[STEP 3 & 4] Initial Login & reCAPTCHA Check...")
                      print("--------------------------------------------------")
                      
                      email_selector = "input[name='email'], input[placeholder='Email']"
                      try:
                          page.wait_for_selector(email_selector, timeout=5000)
                      except:
                          print("[LOG] Email input not immediately shown, checking if login button is needed...")
                          try:
                              page.get_by_role("button", name=re.compile("Log in|Sign in|Login", re.IGNORECASE)).click(force=True)
                          except:
                              pass
                          time.sleep(2)

                      perform_login(page, work_mail, work_password)

                      # STEP 5: Check Clock / START button status with monitoring loop
                      print("\n--------------------------------------------------")
                      print("[STEP 5] Entering monitoring loop (START / Countdown check)...")
                      print("--------------------------------------------------")
                      
                      loop_count = 0
                      while True:
                          loop_count += 1
                          
                          # Kiểm tra xem có bị văng ra trang login sau mỗi lần reload/chạy không
                          perform_login(page, work_mail, work_password)

                          page_content = page.content()
                          
                          # Trường hợp 1: Thấy nút START và chưa ở trạng thái mining -> Bấm luôn
                          if "START" in page_content and "MINING STARTED" not in page_content:
                              print(f"[STEP 5 - RESULT] (Loop {loop_count}) START button detected! Clicking...")
                              try:
                                  page.get_by_text("START").click(force=True)
                              except:
                                  page.locator("text=START").first.click(force=True)
                              
                              print("[STEP 5 - SUCCESS] START clicked! Waiting 10 seconds before shutting down...")
                              time.sleep(10)
                              print("[FINISH] Process completed. Shutting down runner.")
                              break

                          # Trường hợp 2: Đang hiển thị trạng thái MINING STARTED (đồng hồ đếm ngược)
                          elif "MINING STARTED" in page_content:
                              try:
                                  clock_elem = page.locator("text=MINING STARTED").locator("..").locator("div").last
                                  time_str = clock_elem.inner_text().strip()
                                  parts = time_str.split(":")
                                  if len(parts) == 3:
                                      hours = int(parts[0])
                                      minutes = int(parts[1])
                                      seconds = int(parts[2])
                                      print(f"[STEP 5 - CHECK] (Loop {loop_count}) Current remaining time: {hours}h {minutes}m {seconds}s")
                                      
                                      # Nếu thời gian từ 3 giờ trở xuống (<= 3h) -> Treo máy chờ đợi cho đến khi hết giờ
                                      if hours <= 3:
                                          print(f"[STEP 5 - ACTION] Remaining time <= 3 hours ({hours}h {minutes}m). Waiting and watching until finished...")
                                      else:
                                          # Nếu thời gian trên 3 giờ (> 3h) -> Thoát chương trình luôn
                                          print(f"[STEP 5 - ACTION] Remaining time > 3 hours ({hours}h). Shutting down as requested!")
                                          break
                              except Exception as ex:
                                  print(f"[DEBUG] Parsing countdown clock error: {ex}")
                          else:
                              print(f"[STEP 5 - CHECK] (Loop {loop_count}) Status START or MINING STARTED not found yet, refreshing checks...")

                          # Đợi 30 giây rồi reload lại trang để kiểm tra chu kỳ tiếp theo
                          time.sleep(30)
                          try:
                              page.reload(wait_until="networkidle")
                              time.sleep(3)
                          except:
                              pass

                  except Exception as e:
                      print(f"\n[CRITICAL ERROR] An exception occurred during execution: {e}")

                  print("[LOG] Closing browser and finishing session.")
                  context.close()

          if __name__ == "__main__":
              check_and_process()
          '@
          Set-Content -Path "auto.py" -Value $code -Encoding UTF8

      - name: Run auto.py
        shell: powershell
        env:
          MY_WORK_LINK: ${{ secrets.MY_WORK_LINK }}
          MY_WORK_MAIL: ${{ secrets.MY_WORK_MAIL }}
          MY_WORK_PASSWORD: ${{ secrets.MY_WORK_PASSWORD }}
        run: python auto.py

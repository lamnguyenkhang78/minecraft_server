name: VPS

on:
  push:
  workflow_dispatch:
  schedule:
    # Lịch chạy cách nhau 6 tiếng, bắt đầu từ 6h sáng giờ Việt Nam (23:00, 05:00, 11:00, 17:00 UTC)
    - cron: '23 5,11,17 * * *'
    - cron: '23 23 * * *'

jobs:
  run-crd:
    runs-on: windows-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: powershell
        run: |
          pip install playwright
          playwright install chromium

      - name: create file
        shell: powershell
        run: |
          $code = @'
          import time
          import os
          import shutil
          from playwright.sync_api import sync_playwright

          def kiem_tra_va_xu_ly():
              extension_url = os.environ.get("CHROME_EXTENSION_LINK", "")
              work_link = os.environ.get("MY_WORK_LINK", "")
              work_mail = os.environ.get("MY_WORK_MAIL", "")
              work_password = os.environ.get("MY_WORK_PASSWORD", "")

              print("[LOG] Bắt đầu khởi chạy trình duyệt tự động...")

              with sync_playwright() as p:
                  profile_dir = r"C:\temp\playwright_profile_raptor"
                  if os.path.exists(profile_dir):
                      try: shutil.rmtree(profile_dir)
                      except: pass

                  context = p.chromium.launch_persistent_context(
                      user_data_dir=profile_dir,
                      headless=False,
                      args=["--no-sandbox"],
                      viewport={"width": 1366, "height": 768}
                  )
                  
                  page = context.new_page()

                  try:
                      # 1. Cài extension nếu có
                      if extension_url:
                          page.goto(extension_url, wait_until="domcontentloaded")
                          time.sleep(3)
                          try:
                              page.get_by_role("button", name="Add to chrome").click(force=True)
                          except:
                              page.locator("text=Add to Chrome").first.click(force=True)
                          time.sleep(5)

                      # 2. Vào trang login
                      if work_link:
                          page.goto(work_link, wait_until="domcontentloaded")
                          time.sleep(2)

                      # 3. Đăng nhập
                      page.fill("input[placeholder='Email']", work_mail)
                      page.fill("input[placeholder='Password']", work_password)

                      # 4. Chờ giải Captcha (tối đa 5 phút)
                      print("[LOG] Đang chờ giải Captcha...")
                      da_xong = False
                      for _ in range(375):
                          try:
                              checked = page.frame_locator("iframe[title*='reCAPTCHA']").locator("#recaptcha-anchor").get_attribute("aria-checked")
                              if checked == "true":
                                  da_xong = True
                                  break
                          except:
                              pass
                          time.sleep(0.8)

                      if da_xong:
                          # Nhấn Login
                          try:
                              page.get_by_role("button", name="Log in").click(force=True)
                          except:
                              page.locator("text=Log in").first.click(force=True)
                          
                          time.sleep(5)

                          # 5. Kiểm tra trạng thái đồng hồ hoặc nút START
                          print("[LOG] Đang kiểm tra trạng thái đồng hồ / nút START...")
                          
                          # Vòng lặp kiểm tra trạng thái liên tục
                          while True:
                              text_trang_thai = page.content()
                              
                              # Trường hợp đang hiển thị nút START
                              if "START" in text_trang_thai and "MINING STARTED" not in text_trang_thai:
                                  print("[LOG] Phát hiện nút START, tiến hành bấm...")
                                  try:
                                      page.get_by_text("START").click(force=True)
                                  except:
                                      page.locator("text=START").first.click(force=True)
                                  
                                  print("[LOG] Đã bấm START, chờ đồng hồ đếm ngược chạy 10 giây rồi tắt máy...")
                                  time.sleep(10)
                                  break

                              # Trường hợp đồng hồ đang chạy (MINING STARTED)
                              elif "MINING STARTED" in text_trang_thai:
                                  # Lấy chuỗi thời gian đếm ngược dạng HH:MM:SS
                                  try:
                                      # Tìm phần tử hiển thị đồng hồ (ví dụ: 11:59:57)
                                      dong_ho_elem = page.locator("text=MINING STARTED").locator("..").locator("div").last
                                      thoi_gian_str = dong_ho_elem.inner_text().strip()
                                      
                                      parts = thoi_gian_str.split(":")
                                      if len(parts) == 3:
                                          gio = int(parts[0])
                                          phut = int(parts[1])
                                          
                                          print(f"[INFO] Thời gian còn lại trên đồng hồ: {gio} giờ {phut} phút")

                                          # Nếu trên 3 giờ -> Tắt máy luôn để chạy lần khác
                                          if gio >= 3:
                                              print("[LOG] Đồng hồ còn trên 3 giờ. Tắt máy theo yêu cầu!")
                                              break
                                          else:
                                              # Nếu dưới 3 giờ -> Chờ cho tới khi hết giờ / hiện nút START
                                              print("[LOG] Đồng hồ còn dưới 3 giờ, đang chờ đồng hồ chạy xong...")
                                  except Exception as ex:
                                      print(f"[DEBUG] Đang đọc trạng thái đồng hồ: {ex}")

                              time.sleep(5) # Kiểm tra lại sau mỗi 5 giây
                      else:
                          print("[WARNING] Quá thời gian chờ giải Captcha.")

                  except Exception as e:
                      print(f"[LỖI XẢY RA]: {e}")

                  context.close()

          if __name__ == "__main__":
              kiem_tra_va_xu_ly()
          '@
          Set-Content -Path "auto.py" -Value $code -Encoding UTF8

      - name: Run auto.py
        shell: powershell
        env:
          CHROME_EXTENSION_LINK: ${{ secrets.CHROME_EXTENSION_LINK }}
          MY_WORK_LINK: ${{ secrets.MY_WORK_LINK }}
          MY_WORK_MAIL: ${{ secrets.MY_WORK_MAIL }}
          MY_WORK_PASSWORD: ${{ secrets.MY_WORK_PASSWORD }}
        run: python auto.py

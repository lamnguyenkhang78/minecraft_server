name: my_work

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 5,11,17 * * *'
    - cron: '23 23 * * *'

jobs:
  run-crd:
    runs-on: windows-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: powershell
        run: |
          pip install playwright
          playwright install chromium

      - name: create file
        shell: powershell
        run: |
          $code = @'
          import time
          import os
          import shutil
          import sys
          import re

          sys.stdout.reconfigure(encoding='utf-8')
          from playwright.sync_api import sync_playwright

          def check_and_process():
              print("==================================================")
              print("[INIT] Starting automated process...")
              print("==================================================")
              
              extension_url = os.environ.get("CHROME_EXTENSION_LINK", "")
              work_link = os.environ.get("MY_WORK_LINK", "")
              work_mail = os.environ.get("MY_WORK_MAIL", "")
              work_password = os.environ.get("MY_WORK_PASSWORD", "")

              print(f"[CONFIG] Extension Link: {extension_url}")
              print(f"[CONFIG] Work Link (MY_WORK_LINK): {work_link}")
              print(f"[CONFIG] Mail Account: {work_mail}")

              with sync_playwright() as p:
                  profile_dir = r"C:\temp\playwright_profile_raptor"
                  if os.path.exists(profile_dir):
                      print("[LOG] Cleaning up old profile directory...")
                      try: shutil.rmtree(profile_dir)
                      except Exception as e: print(f"[WARNING] Could not delete old profile: {e}")

                  print("[LOG] Launching Chromium browser (headless=False)...")
                  context = p.chromium.launch_persistent_context(
                      user_data_dir=profile_dir,
                      headless=False,
                      args=["--no-sandbox"],
                      viewport={"width": 1366, "height": 768}
                  )
                  
                  page = context.new_page()

                  try:
                      # STEP 1: Install Extension
                      print("\n--------------------------------------------------")
                      print("[STEP 1] Installing browser extension...")
                      print("--------------------------------------------------")
                      if extension_url:
                          print(f"[STEP 1] Navigating to URL: {extension_url}")
                          page.goto(extension_url, wait_until="domcontentloaded")
                          time.sleep(3)
                          print("[STEP 1] Finding and clicking 'Add to chrome' button...")
                          try:
                              page.get_by_role("button", name="Add to chrome").click(force=True)
                              print("[STEP 1 - SUCCESS] Clicked 'Add to chrome' by role successfully!")
                          except Exception as e:
                              print(f"[STEP 1 - RETRY] Role click failed, trying text selector: {e}")
                              page.locator("text=Add to Chrome").first.click(force=True)
                              print("[STEP 1 - SUCCESS] Clicked 'Add to Chrome' by text successfully!")
                          time.sleep(5)
                      else:
                          print("[STEP 1 - SKIPPED] CHROME_EXTENSION_LINK is missing!")

                      # STEP 2: Access Page
                      print("\n--------------------------------------------------")
                      print("[STEP 2] Navigating to target URL...")
                      print("--------------------------------------------------")
                      if work_link:
                          print(f"[STEP 2] Navigating to URL: {work_link}")
                          page.goto(work_link, wait_until="networkidle")
                          time.sleep(3)
                          print(f"[STEP 2] Actual URL after load: {page.url}")
                          print("[STEP 2 - SUCCESS] Successfully loaded page!")
                      else:
                          print("[STEP 2 - ERROR] Missing 'MY_WORK_LINK' variable!")

                      # STEP 3: Fill Credentials
                      print("\n--------------------------------------------------")
                      print("[STEP 3] Entering Email and Password...")
                      print("--------------------------------------------------")
                      
                      email_selector = "input[name='email'], input[placeholder='Email']"
                      
                      try:
                          page.wait_for_selector(email_selector, timeout=5000)
                      except:
                          print("[STEP 3] Email input not immediately visible. Looking for 'Log in' / 'Sign in' button on homepage...")
                          try:
                              page.get_by_role("button", name=re.compile("Log in|Sign in|Login", re.IGNORECASE)).click(force=True)
                          except:
                              try:
                                  page.locator("text=Log in").first.click(force=True)
                              except:
                                  try:
                                      page.locator("text=Sign in").first.click(force=True)
                                  except:
                                      print("[STEP 3] Could not find explicit login button, continuing...")
                          
                          time.sleep(2)
                          page.wait_for_selector(email_selector, timeout=20000)

                      print(f"[STEP 3] Entering Email: {work_mail}")
                      page.fill(email_selector, work_mail)
                      
                      print("[STEP 3] Entering Password...")
                      password_selector = "input[name='password'], input[placeholder='Password']"
                      page.fill(password_selector, work_password)
                      print("[STEP 3 - SUCCESS] Credentials filled successfully!")

                      # STEP 4: Trigger and Wait for reCAPTCHA (Áp dụng chuẩn từ code mẫu)
                      print("\n--------------------------------------------------")
                      print("[STEP 4] Triggering and Waiting for reCAPTCHA...")
                      print("--------------------------------------------------")
                      
                      print("[LOG] Đang click vào khung reCAPTCHA để Extension bắt đầu giải...")
                      try:
                          page.frame_locator("iframe[title*='reCAPTCHA']").locator("#recaptcha-anchor").click(force=True)
                      except:
                          try:
                              page.locator("iframe[title*='reCAPTCHA']").first.click(force=True)
                          except Exception as ex:
                              print(f"[WARNING] Không click được vào anchor reCAPTCHA: {ex}")

                      # Chờ tích xanh tối đa khoảng 3 phút (225 lần x 0.8s)
                      da_xong = False
                      for i in range(1, 226):
                          try:
                              if page.frame_locator("iframe[title*='reCAPTCHA']").locator("#recaptcha-anchor").get_attribute("aria-checked") == "true":
                                  print(f"[STEP 4 - SUCCESS] reCAPTCHA passed (green check) at attempt {i}!")
                                  da_xong = True
                                  break
                          except:
                              pass
                          if i % 10 == 0:
                              print(f"[STEP 4 - WAITING] Đang chờ tích xanh reCAPTCHA... ({i}/225)")
                          time.sleep(0.8)

                      if da_xong:
                          print("[STEP 4 - SUCCESS] Captcha đã giải xong, tiến hành bấm Login...")
                          time.sleep(1)
                          try:
                              page.get_by_role("button", name=re.compile("Log in|Sign in|Login", re.IGNORECASE)).click(force=True)
                          except:
                              try:
                                  page.locator("text=Log in").first.click(force=True)
                              except:
                                  page.locator("button[type='submit']").click(force=True)
                          
                          print("[STEP 4] Login clicked. Waiting 5 seconds for dashboard to load...")
                          time.sleep(5)

                          # STEP 5: Check Clock / START button status
                          print("\n--------------------------------------------------")
                          print("[STEP 5] Checking clock status and START button...")
                          print("--------------------------------------------------")
                          
                          loop_count = 0
                          while True:
                              loop_count += 1
                              page_content = page.content()
                              
                              if "START" in page_content and "MINING STARTED" not in page_content:
                                  print(f"[STEP 5 - RESULT] (Loop {loop_count}) START button detected! Clicking...")
                                  try:
                                      page.get_by_text("START").click(force=True)
                                  except:
                                      page.locator("text=START").first.click(force=True)
                                  
                                  print("[STEP 5 - SUCCESS] START clicked! Waiting 10 seconds before shutting down...")
                                  time.sleep(10)
                                  print("[FINISH] Process completed. Shutting down runner.")
                                  break

                              elif "MINING STARTED" in page_content:
                                  try:
                                      clock_elem = page.locator("text=MINING STARTED").locator("..").locator("div").last
                                      time_str = clock_elem.inner_text().strip()
                                      parts = time_str.split(":")
                                      if len(parts) == 3:
                                          hours = int(parts[0])
                                          minutes = int(parts[1])
                                          seconds = int(parts[2])
                                          print(f"[STEP 5 - CHECK] (Loop {loop_count}) Current remaining time: {hours}h {minutes}m {seconds}s")
                                          if hours >= 3:
                                              print(f"[STEP 5 - ACTION] Remaining time >= 3 hours ({hours}h). Shutting down as requested!")
                                              break
                                          else:
                                              print(f"[STEP 5 - ACTION] Remaining time < 3 hours ({hours}h {minutes}m). Waiting for clock to finish...")
                                  except Exception as ex:
                                      print(f"[DEBUG] Parsing countdown clock error: {ex}")
                              else:
                                  print(f"[STEP 5 - CHECK] (Loop {loop_count}) Status START or MINING STARTED not found yet, refreshing checks...")

                              time.sleep(5)
                      else:
                          print("[STEP 4 - ERROR] reCAPTCHA timeout (exceeded 3 phút). Extension không giải kịp hoặc không tìm thấy captcha.")

                  except Exception as e:
                      print(f"\n[CRITICAL ERROR] An exception occurred during execution: {e}")

                  print("[LOG] Closing browser and finishing session.")
                  context.close()

          if __name__ == "__main__":
              check_and_process()
          '@
          Set-Content -Path "auto.py" -Value $code -Encoding UTF8

      - name: Run auto.py
        shell: powershell
        env:
          CHROME_EXTENSION_LINK: ${{ secrets.CHROME_EXTENSION_LINK }}
          MY_WORK_LINK: ${{ secrets.MY_WORK_LINK }}
          MY_WORK_MAIL: ${{ secrets.MY_WORK_MAIL }}
          MY_WORK_PASSWORD: ${{ secrets.MY_WORK_PASSWORD }}
        run: python auto.py

name: my_work

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23,5,11,17 * * *'

jobs:
  run-crd:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: powershell
        run: |
          pip install playwright pyautogui
          playwright install chromium

      - name: Prepare Extension & Script
        shell: powershell
        run: |
          $extDir = "C:\extensions"
          if (Test-Path $extDir) { Remove-Item -Recurse -Force $extDir }
          New-Item -ItemType Directory -Force -Path $extDir | Out-Null
          
          $extensionUrl = "https://github.com/lamnguyenkhang78/minecraft_server/releases/download/mywork/iomcoelgdkghlligeempdbfcaobodacg.zip"
          
          Write-Host "[LOG] Downloading extension package from direct link..."
          $zipPath = "$extDir\extension.zip"
          try {
              Invoke-WebRequest -Uri $extensionUrl -OutFile $zipPath
              Write-Host "[LOG] Extracting extension archive..."
              Expand-Archive -Path $zipPath -DestinationPath $extDir -Force
              Remove-Item $zipPath -Force
              Write-Host "[SUCCESS] Extension downloaded and extracted!"
          } catch {
              Write-Host "[ERROR] Failed to download extension: $_"
          }

      - name: create file
        shell: powershell
        run: |
          $code = @'
          import time
          import os
          import shutil
          import sys
          import json
          import re
          sys.stdout.reconfigure(encoding='utf-8')
          from playwright.sync_api import sync_playwright
          import pyautogui

          def find_extension_root(base_dir):
              if not os.path.exists(base_dir):
                  return None
              if os.path.exists(os.path.join(base_dir, "manifest.json")):
                  return base_dir
              for root, dirs, files in os.walk(base_dir):
                  if "manifest.json" in files:
                      return root
              return base_dir

          def setup_chrome_preferences(profile_dir):
              try:
                  os.makedirs(profile_dir, exist_ok=True)
                  default_dir = os.path.join(profile_dir, "Default")
                  os.makedirs(default_dir, exist_ok=True)
                  
                  prefs_path = os.path.join(default_dir, "Preferences")
                  prefs = {
                      "credentials_enable_service": False,
                      "profile": {
                          "password_manager_enabled": False
                      },
                      "autofill": {
                          "profile_enabled": False,
                          "credit_card_enabled": False
                      }
                  }
                  with open(prefs_path, "w", encoding="utf-8") as f:
                      json.dump(prefs, f)
                  print("[SETUP] Chrome preferences updated.")
              except Exception as e:
                  print(f"[WARNING] Could not write Chrome preferences: {e}")

          def perform_login(page, work_mail, work_password):
              print("[LOGIN HELPER] Checking if login/signin is required...")
              try:
                  login_link = page.locator("a[href*='signin'], a:has-text('Log in')").first
                  if login_link.is_visible(timeout=3000):
                      print("[LOGIN HELPER] Found 'Log in' button on homepage. Clicking to navigate...")
                      login_link.click(force=True)
                      time.sleep(3)
              except:
                  pass

              email_selector = "input[name='email'], input[placeholder='Email']"
              is_login_page = False
              try:
                  if page.locator(email_selector).is_visible(timeout=3000):
                      is_login_page = True
              except:
                  pass

              if is_login_page:
                  print("[LOGIN HELPER] Detected login page. Re-authenticating...")
                  try:
                      page.fill(email_selector, work_mail)
                      password_selector = "input[name='password'], input[placeholder='Password']"
                      page.fill(password_selector, work_password)
                      
                      print("[LOGIN HELPER] Triggering reCAPTCHA...")
                      try:
                          page.frame_locator("iframe[title*='reCAPTCHA']").locator("#recaptcha-anchor").click(force=True)
                      except:
                          try:
                              page.locator("iframe[title*='reCAPTCHA']").first.click(force=True)
                          except Exception as ex:
                              print(f"[WARNING] Could not click reCAPTCHA anchor: {ex}")

                      solved = False
                      for _ in range(150):
                          try:
                              if page.frame_locator("iframe[title*='reCAPTCHA']").locator("#recaptcha-anchor").get_attribute("aria-checked") == "true":
                                  solved = True
                                  break
                          except:
                              pass
                          time.sleep(0.8)

                      if solved:
                          print("[LOGIN HELPER] reCAPTCHA passed! Clicking Login submit button...")
                          try:
                              page.get_by_role("button", name=re.compile("Log in|Sign in|Login", re.IGNORECASE)).click(force=True)
                          except:
                              try:
                                  page.locator("text=Log in").first.click(force=True)
                              except:
                                  page.locator("button[type='submit']").click(force=True)
                          
                          print("[LOGIN HELPER] Login submitted. Waiting 2s before pressing ENTER...")
                          time.sleep(2)
                          
                          print("[LOGIN HELPER] Pressing ENTER via PyAutoGUI to dismiss popup...")
                          pyautogui.press('enter')
                          
                          print("[LOGIN HELPER] Waiting 1s after pressing ENTER...")
                          time.sleep(1)
                          
                          print("[LOGIN HELPER] Re-login completed successfully!")
                          return True
                      else:
                          print("[LOGIN HELPER] reCAPTCHA solving timeout during re-login.")
                  except Exception as ex:
                      print(f"[ERROR] Exception during re-login process: {ex}")
              return False

          def parse_hours_from_timer(timer_str):
              try:
                  parts = timer_str.split(":")
                  if len(parts) >= 1:
                      return float(parts[0])
              except:
                  pass
              return 0.0

          def check_and_process():
              print("==================================================")
              print("[INIT] Starting automated process...")
              print("==================================================")
              
              work_link = os.environ.get("MY_WORK_LINK")
              work_mail = os.environ.get("MY_WORK_MAIL")
              work_password = os.environ.get("MY_WORK_PASSWORD")
              
              if not work_link or not work_mail or not work_password:
                  print("[CRITICAL ERROR] Missing one or more environment variables (MY_WORK_LINK, MY_WORK_MAIL, MY_WORK_PASSWORD).")
                  return

              raw_ext_path = r"C:\extensions"
              extension_path = find_extension_root(raw_ext_path)

              with sync_playwright() as p:
                  profile_dir = r"C:\temp\playwright_profile_raptor"
                  if os.path.exists(profile_dir):
                      try: 
                          shutil.rmtree(profile_dir)
                          print("[LOG] Cleared old browser profile successfully.")
                      except: 
                          pass

                  setup_chrome_preferences(profile_dir)

                  launch_args = [
                      "--no-sandbox",
                      "--disable-save-password-bubble",
                      "--disable-features=PasswordLeakDetection,AutofillServerCommunication"
                  ]
                  
                  if extension_path and os.path.exists(os.path.join(extension_path, "manifest.json")):
                      launch_args.append(f"--load-extension={extension_path}")
                      launch_args.append(f"--disable-extensions-except={extension_path}")

                  context = p.chromium.launch_persistent_context(
                      user_data_dir=profile_dir,
                      headless=False,
                      args=launch_args,
                      viewport={"width": 1366, "height": 768},
                      ignore_default_args=["--enable-automation"]
                  )
                  
                  page = context.new_page()
                  try:
                      print("\n--------------------------------------------------")
                      print("[STEP 1] Navigating to target URL...")
                      print("--------------------------------------------------")
                      page.goto(work_link, wait_until="domcontentloaded", timeout=60000)
                      time.sleep(5)

                      print("\n--------------------------------------------------")
                      print("[STEP 2] Performing initial login...")
                      print("--------------------------------------------------")
                      perform_login(page, work_mail, work_password)

                      print("\n--------------------------------------------------")
                      print("[STEP 3] Entering continuous watchdog loop...")
                      print("--------------------------------------------------")
                      
                      attempt = 0
                      while True:
                          attempt += 1
                          print(f"\n[WATCHDOG Loop #{attempt}] Checking state...")
                          
                          timer_text = page.evaluate("""
                              () => {
                                  const timerEl = document.getElementById('timer');
                                  return timerEl ? timerEl.textContent.trim() : "Unknown";
                              }
                          """)
                          print(f"[INFO] Timer value: {timer_text}")
                          
                          hours_left = parse_hours_from_timer(timer_text)
                          if timer_text != "Unknown" and hours_left > 3:
                              print(f"[INFO] Remaining time is {timer_text} (> 3 hours). Shutting down task as requested.")
                              break

                          has_start = False
                          try:
                              start_el = page.locator("#startButton")
                              if start_el.is_visible(timeout=3000):
                                  has_start = True
                          except:
                              pass

                          if has_start:
                              print("[INFO] Found #startButton! Clicking START...")
                              page.locator("#startButton").click(force=True)
                              print("[INFO] Clicked START successfully. Waiting 10 seconds before exit...")
                              time.sleep(10)
                              break
                          else:
                              print("[INFO] #startButton not visible or time <= 3h. Waiting 30s to reload and re-check...")
                              time.sleep(30)
                              try:
                                  print("[LOG] Reloading page...")
                                  page.reload(wait_until="domcontentloaded", timeout=60000)
                                  time.sleep(3)
                                  perform_login(page, work_mail, work_password)
                              except Exception as e:
                                  print(f"[WARNING] Error during reload loop: {e}")

                      print("[FINISH] Script execution finished successfully.")
                      time.sleep(3)
                  except Exception as e:
                      print(f"\n[CRITICAL ERROR]: {e}")

                  context.close()

          if __name__ == "__main__":
              check_and_process()
          '@
          Set-Content -Path "auto.py" -Value $code -Encoding UTF8

      - name: Run auto.py
        shell: powershell
        env:
          MY_WORK_LINK: ${{ secrets.MY_WORK_LINK }}
          MY_WORK_MAIL: ${{ secrets.MY_WORK_MAIL }}
          MY_WORK_PASSWORD: ${{ secrets.MY_WORK_PASSWORD }}
        run: python auto.py

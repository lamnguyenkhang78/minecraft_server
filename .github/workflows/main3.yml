name: Keep_Alive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-keep-alive:
    runs-on: windows-latest
    
    # Cấp quyền đọc và ghi trực tiếp cho job này
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: keep_alive
        shell: powershell
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if (!(Test-Path "temp")) {
              New-Item -ItemType Directory -Force -Path "temp" | Out-Null
          }
          
          $files = Get-ChildItem -Path "temp" -Filter "*.txt" | Sort-Object { [int]($_.BaseName -replace '\D') }
          
          if ($files.Count -ge 100) {
              Write-Host "[INFO] Thư mục temp đã đủ 100 file. Đang dọn dẹp..."
              Remove-Item -Path "temp/*" -Force
              $nextNumber = 1
          } else {
              if ($files.Count -eq 0) {
                  $nextNumber = 1
              } else {
                  $lastFile = $files[-1].BaseName
                  $lastNum = 0
                  if ([int]::TryParse($lastFile, [ref]$lastNum)) {
                      $nextNumber = $lastNum + 1
                  } else {
                      $nextNumber = $files.Count + 1
                  }
              }
          }
          
          $fileName = "temp/$nextNumber.txt"
          $dateReadable = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          
          Set-Content -Path $fileName -Value "Keep-alive active at: $dateReadable (File thứ $nextNumber)"
          
          git add -A
          
          $status = git status --porcelain
          if ($status) {
              git commit -m "chore(keep_alive): update file $nextNumber.txt [$dateReadable]"
              git push
              Write-Host "[SUCCESS] Đã tạo file $nextNumber.txt và cập nhật repo thành công!"
          } else {
              Write-Host "[INFO] Không có thay đổi mới."
          }
